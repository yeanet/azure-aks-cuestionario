apiVersion: v1
kind: Service

metadata:
  name: {{ include "cuestionario.fullname" . }}
  labels:
    {{- include "cuestionario.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: http

  selector:
    {{- include "cuestionario.selectorLabels" . | nindent 4 }}
