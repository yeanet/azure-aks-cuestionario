name: Terraform - Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar la destrucción completa"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-destroy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY para continuar."
            exit 1
          fi

          echo "Confirmación válida."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: Destroy Summary
        if: success()
        run: |
          {
            echo "## Terraform Destroy"
            echo ""
            echo "**Estado:** Infraestructura destruida"
            echo ""
            echo "Recursos administrados por Terraform:"
            echo ""
            echo "- AKS"
            echo "- ACR"
            echo "- VNet"
            echo "- Subnet"
            echo "- Resource Group"
            echo "- Otros recursos administrados por Terraform"
            echo ""
            echo "El Terraform State remoto permanece en Azure Storage."
          } >> "$GITHUB_STEP_SUMMARY"