name: Terraform - Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY."
            exit 1
          fi

          echo "Confirmación válida."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: |
          terraform init -reconfigure

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "RECURSOS EN TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "GENERANDO DESTROY PLAN"
          echo "========================================"

          terraform plan \
            -destroy \
            -out=destroy.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "EJECUTANDO DESTROY"
          echo "========================================"

          terraform apply \
            -auto-approve \
            destroy.tfplan

      - name: Terraform State After Destroy
        if: always()
        run: |
          echo "========================================"
          echo "STATE DESPUÉS DEL DESTROY"
          echo "========================================"

          terraform state list || true