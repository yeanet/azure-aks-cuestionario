```yaml
name: Infrastructure - Destroy AKS + ACR + Kubernetes

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ============================================================
  # VALIDATION
  # ============================================================

  validate:
    name: Validate Destroy
    runs-on: ubuntu-latest

    steps:

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY."
            exit 1
          fi

          echo "Confirmación válida."


  # ============================================================
  # DESTROY ARGO CD APPLICATION
  # ============================================================

  destroy-argocd-application:
    name: Destroy - Argo CD Application
    runs-on: ubuntu-latest

    needs:
      - validate

    defaults:
      run:
        working-directory: terraform/argocd-app

    env:
      TF_VAR_argocd_repo_password: ${{ secrets.ARGOCD_REPO_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Argo CD Terraform variable
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK ARGO CD TERRAFORM VARIABLES"
          echo "========================================"

          if [ -z "${TF_VAR_argocd_repo_password}" ]; then
            echo "ERROR: El secret ARGOCD_REPO_PASSWORD no está definido."
            exit 1
          fi

          echo "ARGOCD_REPO_PASSWORD está disponible."

      - name: Terraform Init
        run: |
          terraform init -input=false

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "ARGO CD TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Plan Destroy
        run: |
          echo "========================================"
          echo "ARGO CD DESTROY PLAN"
          echo "========================================"

          terraform plan \
            -destroy \
            -input=false \
            -out=tfplan

      - name: Terraform Apply Destroy
        run: |
          echo "========================================"
          echo "ARGO CD DESTROY"
          echo "========================================"

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


  # ============================================================
  # DESTROY KUBERNETES RESOURCES
  # ============================================================

  destroy-kubernetes:
    name: Destroy Kubernetes Resources
    runs-on: ubuntu-latest

    needs:
      - destroy-argocd-application

    defaults:
      run:
        working-directory: terraform/k8s

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init -input=false

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "KUBERNETES TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "KUBERNETES DESTROY PLAN"
          echo "========================================"

          terraform plan \
            -destroy \
            -input=false \
            -out=destroy-k8s.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "KUBERNETES DESTROY"
          echo "========================================"

          terraform apply \
            -input=false \
            -auto-approve \
            destroy-k8s.tfplan


  # ============================================================
  # DESTROY AZURE INFRASTRUCTURE
  # ============================================================

  destroy-infrastructure:
    name: Destroy Azure Infrastructure
    runs-on: ubuntu-latest

    needs:
      - destroy-kubernetes

    defaults:
      run:
        working-directory: terraform/infraAKS

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init -input=false

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE DESTROY PLAN"
          echo "========================================"

          terraform plan \
            -destroy \
            -input=false \
            -out=destroy-infra.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE DESTROY"
          echo "========================================"

          terraform apply \
            -input=false \
            -auto-approve \
            destroy-infra.tfplan
```
