name: Infrastructure - Destroy AKS + ACR

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY."
            exit 1
          fi

          echo "Confirmación válida."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "TERRAFORM DESTROY PLAN"
          echo "========================================"

          terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "TERRAFORM DESTROY"
          echo "========================================"

          terraform apply -auto-approve destroy.tfplan