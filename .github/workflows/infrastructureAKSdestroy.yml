name: Infrastructure - Destroy AKS + ACR + Kubernetes

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  validate:
    name: Validate Destroy
    runs-on: ubuntu-latest

    steps:

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY."
            exit 1
          fi

          echo "Confirmación válida."


  destroy-kubernetes:
    name: Destroy Kubernetes Resources
    runs-on: ubuntu-latest

    needs:
      - validate

    defaults:
      run:
        working-directory: terraform/k8s

    steps:

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "KUBERNETES TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "KUBERNETES DESTROY PLAN"
          echo "========================================"

          terraform plan -destroy -out=destroy-k8s.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "KUBERNETES DESTROY"
          echo "========================================"

          terraform apply -auto-approve destroy-k8s.tfplan


  destroy-infrastructure:
    name: Destroy Azure Infrastructure
    runs-on: ubuntu-latest

    needs:
      - destroy-kubernetes

    defaults:
      run:
        working-directory: terraform/infraAKS

    steps:

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform State List
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE TERRAFORM STATE"
          echo "========================================"

          terraform state list

      - name: Terraform Destroy Plan
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE DESTROY PLAN"
          echo "========================================"

          terraform plan -destroy -out=destroy-infra.tfplan

      - name: Terraform Destroy
        run: |
          echo "========================================"
          echo "INFRASTRUCTURE DESTROY"
          echo "========================================"

          terraform apply -auto-approve destroy-infra.tfplan