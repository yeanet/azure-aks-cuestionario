name: Terraform - Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escribe DESTROY para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-destroy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Validar confirmación
      # --------------------------------------------------
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Debes escribir exactamente DESTROY."
            exit 1
          fi

          echo "Confirmación válida."

      # --------------------------------------------------
      # 2. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 3. Azure Login mediante OIDC
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 4. Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # --------------------------------------------------
      # 5. Verificar directorio Terraform
      # --------------------------------------------------
      - name: Check Terraform files
        run: |
          echo "========================================"
          echo "       DIRECTORIO TERRAFORM"
          echo "========================================"

          pwd

          echo ""
          echo "Archivos:"
          ls -la

          echo ""
          echo "Backend Terraform:"
          cat backend.tf

      # --------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init -reconfigure

      # --------------------------------------------------
      # 7. Verificar State remoto
      # --------------------------------------------------
      - name: Check Terraform State
        run: |
          echo "========================================"
          echo "       TERRAFORM STATE"
          echo "========================================"

          terraform state list

          echo ""
          echo "========================================"
          echo "       STATE COUNT"
          echo "========================================"

          terraform state list | wc -l

      # --------------------------------------------------
      # 8. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: |
          terraform validate

      # --------------------------------------------------
      # 9. Terraform Plan Destroy
      # --------------------------------------------------
      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -out=destroy.tfplan

      # --------------------------------------------------
      # 10. Mostrar resultado
      # --------------------------------------------------
      - name: Destroy Plan Summary
        run: |
          echo "========================================"
          echo "       DESTROY PLAN COMPLETADO"
          echo "========================================"

          echo ""
          echo "Este workflow todavía NO ejecuta destroy."
          echo ""
          echo "El plan se ha generado correctamente."