name: Infrastructure - AKS + ACR + Kubernetes

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  infrastructure:
    name: Terraform Infra - Azure + AKS + ACR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infraAKS

    steps:

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  kubernetes:
    name: Terraform Kubernetes - NGINX + Argo CD
    runs-on: ubuntu-latest

    needs:
      - infrastructure

    defaults:
      run:
        working-directory: terraform/k8s

    steps:

      - name: Azure Setup
        uses: ./.github/actions/azure-setup

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


